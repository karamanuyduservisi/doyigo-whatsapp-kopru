name: DoyiGo WhatsApp APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Android SDK
        run: |
          set -e
          SDK_TOOL="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -1)"
          test -x "$SDK_TOOL"
          yes | "$SDK_TOOL" --licenses >/dev/null || true
          "$SDK_TOOL" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Stage Android APK signature tool
        shell: bash
        run: |
          set -euo pipefail
          SIGNER="$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar"
          test -s "$SIGNER"
          mkdir -p "$RUNNER_TEMP/apk-signing-tool"
          cp "$SIGNER" "$RUNNER_TEMP/apk-signing-tool/apksigner.jar"
      - name: Upload APK signature tool
        uses: actions/upload-artifact@v4
        with:
          name: android-apksigner-tool
          path: ${{ runner.temp }}/apk-signing-tool/apksigner.jar
          if-no-files-found: error
          retention-days: 3
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: doyigo-whatsapp-kopru
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
